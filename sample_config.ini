# GA+STOMP sample configuration file
# Copy and edit this file, then run:  ./ga_stomp my_config.ini

# --- Search bounds ---
m_min         = 10
m_max         = 300
ez_min        = 0.25
ez_max        = 1.0
k_min         = 2
k_max         = 20

# --- GA parameters ---
population    = 50
generations   = 30
tournament_k  = 3
mutation_rate = 0.30
elite_count   = 2

# --- Approximation (set <1.0 to use SCRIMP++ mode for large series) ---
approx_frac   = 1.0     # 1.0 = full STOMP; 0.3 = 30% diagonals (faster)

# --- Reproducibility report ---
n_seeds       = 5       # number of GA seeds for variance analysis

# --- Input/output ---
verbose       = 1
input_path    = data/IR007_1797.csv
output_dir    = results/IR007